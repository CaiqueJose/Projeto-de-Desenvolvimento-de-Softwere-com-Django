{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro - {{ livro.titulo }}</title>

    <!-- Bootstrap 4 CSS (versão estável e compatível com crispy-bootstrap4) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">

            <!-- Botão Voltar -->
            <a href="{% url 'livros' %}" class="btn btn-secondary mb-4">
                ← Voltar para Lista de Livros
            </a>

            <!-- Card com detalhes e formulário -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Editar Livro: <strong>{{ livro.titulo }}</strong></h3>
                </div>
                <div class="card-body">

                    <!-- Mensagens de sucesso/erro -->
                    {% if messages %}
                        <div class="mb-4">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="close" data-dismiss="alert">
                                        <span>&times;</span>
                                    </button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <!-- Formulário com crispy-forms -->
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg px-5">
                                Salvar Alterações
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">
                    Sistema de Biblioteca • Edição de Livro
                </small>
            </div>
        </div>
    </div>
</div>

<!-- Scripts do Bootstrap 4 + jQuery + Popper -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
